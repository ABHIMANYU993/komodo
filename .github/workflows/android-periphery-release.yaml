name: Android Periphery Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

jobs:
  build-release:
    name: Build & Package Android Periphery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Setup Android NDK
        run: |
          # Use pre-installed NDK on ubuntu-latest runner
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "Using Android NDK at: $ANDROID_NDK_LATEST_HOME"

      - name: Run Unit Tests
        run: |
          cargo test --manifest-path android-periphery/Cargo.toml --verbose

      - name: Package Release Artifacts
        run: |
          ./android-periphery/package.sh

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: komodo-android-periphery-release
          path: |
            android-periphery/dist/komodo-android-periphery.zip
            android-periphery/dist/komodo-android-periphery.zip.sha256
            android-periphery/dist/komodo-android-periphery-*.zip
            android-periphery/dist/komodo-android-periphery-*.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          [ -z "$TAG" ] && TAG="${{ github.event.inputs.release_tag }}"
          [ -z "$TAG" ] && TAG="v0.1.0"
          echo "Publishing GitHub Release for $TAG..."
          gh release create "$TAG" \
            android-periphery/dist/komodo-android-periphery.zip \
            android-periphery/dist/komodo-android-periphery.zip.sha256 \
            --title "Komodo Android Periphery $TAG" \
            --notes "Automated release of Komodo Android Periphery ($TAG)" || \
          gh release upload "$TAG" \
            android-periphery/dist/komodo-android-periphery.zip \
            android-periphery/dist/komodo-android-periphery.zip.sha256 \
            --clobber || true
