name: Android Periphery Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Android Periphery
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Setup Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "Using Android NDK at: $ANDROID_NDK_LATEST_HOME"

      - name: Run Unit Tests
        run: |
          cargo test --manifest-path android-periphery/Cargo.toml --verbose

      - name: Package Release Artifacts
        run: |
          ./android-periphery/package.sh

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: komodo-android-periphery-release
          path: |
            android-periphery/dist/komodo-android-periphery.zip
            android-periphery/dist/komodo-android-periphery.zip.sha256
            android-periphery/dist/komodo-android-periphery-*.zip
            android-periphery/dist/komodo-android-periphery-*.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.release_tag || 'v0.1.0' }}
          name: Komodo Android Periphery ${{ github.ref_name || github.event.inputs.release_tag || 'v0.1.0' }}
          body: |
            ## Komodo Android Periphery Release
            Automated production release of Komodo Android Periphery agent and Magisk deployment packages for Android (aarch64).
            
            ### Included Assets
            - `komodo-android-periphery.zip`: Canonical Magisk module package (always points to current release)
            - `komodo-android-periphery.zip.sha256`: SHA-256 checksum
            - `komodo-android-periphery-v0.1.0.zip`: Versioned Magisk module package
            - `komodo-android-periphery-v0.1.0.zip.sha256`: Versioned SHA-256 checksum
          files: |
            android-periphery/dist/komodo-android-periphery.zip
            android-periphery/dist/komodo-android-periphery.zip.sha256
            android-periphery/dist/komodo-android-periphery-*.zip
            android-periphery/dist/komodo-android-periphery-*.zip.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
