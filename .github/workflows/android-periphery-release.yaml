name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v2.4.1)'
        required: false
        default: 'v2.4.1'

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.release_tag || 'v2.4.1' }}
          name: Komodo ${{ github.ref_name || github.event.inputs.release_tag || 'v2.4.1' }}
          body: |
            ## Komodo Production Release ${{ github.ref_name || github.event.inputs.release_tag || 'v2.4.1' }}
            Automated production release of Komodo Core, Linux Periphery (GNU/musl), Komodo CLI, and Android Periphery.

            ### Linux Binaries (x86_64)
            - `periphery-x86_64-musl`: Statically linked Periphery binary for Alpine Linux, OpenRC, and all Linux distros
            - `periphery-x86_64`: Dynamically linked Periphery binary for glibc Linux distributions
            - `periphery`: Canonical Linux Periphery binary
            - `km-x86_64`: Komodo CLI binary
            - `core-x86_64.tar.gz`: Komodo Core release binary archive

            ### Android Periphery (aarch64)
            - `komodo-android-periphery`: Standalone stripped Android binary
            - `komodo-android-periphery.zip`: Canonical Magisk module deployment package
            - `komodo-android-periphery-v2.4.1.zip`: Versioned Magisk module package

            ### Checksums
            - `SHA256SUMS.txt`: SHA-256 checksums for all release artifacts
          files: |
            release-dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
