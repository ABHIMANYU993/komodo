name: Build & Push Docker Images

## Follows the official komodo build architecture:
## 1. Compile all binaries from source → ghcr.io/.../komodo-binaries
## 2. Build komodo-core  (binaries + UI built from source) → ghcr.io/.../komodo-core
## 3. Build komodo-periphery (binaries) → ghcr.io/.../komodo-periphery
## 4. Build komodo-android-periphery (aarch64 native binary) → ghcr.io/.../komodo-android-periphery

on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'client/**'
      - 'ui/**'
      - 'android-periphery/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker-build-push.yaml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 2.4.0)'
        required: false
        default: '2.4.2'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # All image names must be lowercase
  OWNER: abhimanyu993

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Compile Rust binaries (core, periphery, km) from source
  # Commented out per user instruction to save build time; uses
  # prebuilt ghcr.io/abhimanyu993/komodo-binaries:2 instead.
