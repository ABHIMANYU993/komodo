  #         docker buildx build \
  #           --platform linux/amd64 \
  #           -t ${{ env.REGISTRY }}/${{ env.OWNER }}/komodo-binaries:${{ steps.ver.outputs.version }} \
  #           -t ${{ env.REGISTRY }}/${{ env.OWNER }}/komodo-binaries:2 \
  #           --push .binaries-ctx

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build komodo-core image
  # Uses bin/core/single-arch.Dockerfile (builds UI from source too)
  # ─────────────────────────────────────────────────────────────
  build-core:
    name: Build komodo-core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=2.4.2" >> $GITHUB_OUTPUT
          fi

      - name: Build and push komodo-core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bin/core/single-arch.Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BINARIES_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/komodo-binaries:2
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/komodo-core:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/komodo-core:2
            ${{ env.REGISTRY }}/${{ env.OWNER }}/komodo-core:latest
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Build komodo-periphery image
  # Uses bin/periphery/single-arch.Dockerfile
  # ─────────────────────────────────────────────────────────────
  build-periphery:
    name: Build komodo-periphery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=2.4.2" >> $GITHUB_OUTPUT
          fi

      - name: Build and push komodo-periphery
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bin/periphery/single-arch.Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BINARIES_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/komodo-binaries:2
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/komodo-periphery:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/komodo-periphery:2
            ${{ env.REGISTRY }}/${{ env.OWNER }}/komodo-periphery:latest
          cache-from: type=gha,scope=periphery
          cache-to: type=gha,mode=max,scope=periphery
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Build komodo-android-periphery Docker image
  # Compiles the aarch64 Android binary and packages it as an image
  # alongside its Magisk module assets for distribution
  # ─────────────────────────────────────────────────────────────
  build-android-periphery:
    name: Build komodo-android-periphery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Setup Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=2.4.2" >> $GITHUB_OUTPUT
          fi

      - name: Build Android binary (aarch64)
        run: |
          cd android-periphery
          # Configure NDK linker for aarch64-linux-android
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android35-clang"
          EOF
          cargo build --release --target aarch64-linux-android

      - name: Stage binary into build context
        run: |
          # Copy the compiled aarch64 binary into android-periphery/dist/
          # so the Dockerfile can COPY it from within its own directory context
          mkdir -p android-periphery/dist
          cp android-periphery/target/aarch64-linux-android/release/komodo-android-periphery \
             android-periphery/dist/komodo-android-periphery
          chmod +x android-periphery/dist/komodo-android-periphery
          echo "Binary staged:"
          ls -lh android-periphery/dist/

      - name: Build and push komodo-android-periphery image
        uses: docker/build-push-action@v6
        with:
          context: android-periphery
          file: android-periphery/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/komodo-android-periphery:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/komodo-android-periphery:2
            ${{ env.REGISTRY }}/${{ env.OWNER }}/komodo-android-periphery:latest
          cache-from: type=gha,scope=android-periphery
          cache-to: type=gha,mode=max,scope=android-periphery
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

