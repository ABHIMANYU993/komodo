  #       run: |
  #         mkdir -p .binaries-ctx
  #         cp target/release/core target/release/periphery target/release/km .binaries-ctx/
  #         cat > .binaries-ctx/Dockerfile <<'EOF'
  #         FROM scratch
  #         COPY core /core
  #         COPY periphery /periphery
  #         COPY km /km
  #         LABEL org.opencontainers.image.source="https://github.com/moghtech/komodo"
  #         LABEL org.opencontainers.image.description="Komodo Binaries"
