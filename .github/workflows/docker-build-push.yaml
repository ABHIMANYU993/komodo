name: Build & Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'client/**'
      - 'ui/**'
      - 'ui-patched-assets/**'
      - 'core-patched-bin/**'
      - 'compose/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile.core'
      - 'Dockerfile.periphery'
      - '.github/workflows/docker-build-push.yaml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (e.g. 2.4.0 or latest)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CORE_IMAGE: ghcr.io/${{ github.repository_owner }}/komodo-core
  PERIPHERY_IMAGE: ghcr.io/${{ github.repository_owner }}/komodo-periphery

jobs:
  build-core:
    name: Build komodo-core image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
            echo "latest=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "latest=false" >> $GITHUB_OUTPUT
          else
            echo "tag=main" >> $GITHUB_OUTPUT
            echo "latest=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push komodo-core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.core
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.CORE_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.latest == 'true' && format('{0}:latest', env.CORE_IMAGE) || '' }}
            ${{ steps.tag.outputs.latest == 'true' && format('{0}:2', env.CORE_IMAGE) || '' }}
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  build-periphery:
    name: Build komodo-periphery image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
            echo "latest=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "latest=false" >> $GITHUB_OUTPUT
          else
            echo "tag=main" >> $GITHUB_OUTPUT
            echo "latest=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push komodo-periphery
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.periphery
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.PERIPHERY_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.latest == 'true' && format('{0}:latest', env.PERIPHERY_IMAGE) || '' }}
            ${{ steps.tag.outputs.latest == 'true' && format('{0}:2', env.PERIPHERY_IMAGE) || '' }}
          cache-from: type=gha,scope=periphery
          cache-to: type=gha,mode=max,scope=periphery
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
