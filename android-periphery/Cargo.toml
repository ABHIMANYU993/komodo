[workspace]

[package]
name = "komodo-android-periphery"
version = "2.4.2"
edition = "2024"
license = "GPL-3.0-or-later"

authors = ["Komodo Android Contributors"]
description = "Standalone native Android Periphery daemon for Komodo Core"

[[bin]]
name = "komodo-android-periphery"
path = "src/main.rs"

[dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# WebSocket & Transport
tokio-tungstenite = { version = "0.26", features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"

# Cryptography & Zero-Trust Authentication
snow = { version = "0.10", default-features = false, features = ["ring-resolver"] }
mogh_pki = "1.2"
sha1 = "0.10"
sha2 = "0.10"
blake2 = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
data-encoding = "2.6"

# Serialization & Identifiers
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
url = "2.5"
urlencoding = "2.1"
strum = { version = "0.26", features = ["derive"] }

# System & Terminal
libc = "0.2"
nix = { version = "0.29", features = ["fs", "term", "process", "signal", "ioctl", "poll"] }

# Logging & Configuration
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.8"
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
arc-swap = "1.7"
